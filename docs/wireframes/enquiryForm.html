<div
  style="
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg);
    padding: 1.5rem;
    display: flex;
    justify-content: center;
  "
>
  <div
    style="
      width: 340px;
      background: #ffffff;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-lg);
      overflow: hidden;
    "
  >
    <div
      style="
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 15px;
        background: #ffffff;
        border-bottom: 0.5px solid #dceee6;
      "
    >
      <span style="font-size: 13px; font-weight: 500; color: #0f6e56"
        ><i
          class="ti ti-arrow-left"
          aria-hidden="true"
          style="font-size: 14px; vertical-align: -2px"
        ></i>
        Back</span
      >
    </div>

    <div style="padding: 16px 16px 18px">
      <p
        style="
          margin: 0 0 3px;
          font-size: 18px;
          font-weight: 500;
          color: #04342c;
        "
      >
        Enquire about this trip
      </p>
      <p
        style="
          margin: 0 0 18px;
          font-size: 13px;
          color: var(--color-text-secondary);
        "
      >
        Tell us a little, and we'll call you back.
      </p>

      <label
        style="
          display: block;
          font-size: 12px;
          font-weight: 500;
          color: #04342c;
          margin-bottom: 5px;
        "
        >Name</label
      >
      <div
        style="
          height: 38px;
          border: 0.5px solid #c5e5d9;
          border-radius: var(--border-radius-md);
          display: flex;
          align-items: center;
          padding: 0 11px;
          margin-bottom: 14px;
        "
      >
        <span style="font-size: 13px; color: var(--color-text-tertiary)"
          >Your name</span
        >
      </div>

      <label
        style="
          display: block;
          font-size: 12px;
          font-weight: 500;
          color: #04342c;
          margin-bottom: 5px;
        "
        >Phone</label
      >
      <div
        style="
          height: 38px;
          border: 0.5px solid #c5e5d9;
          border-radius: var(--border-radius-md);
          display: flex;
          align-items: center;
          padding: 0 11px;
          margin-bottom: 14px;
        "
      >
        <span style="font-size: 13px; color: var(--color-text-tertiary)"
          >+91 ·········</span
        >
      </div>

      <label
        style="
          display: block;
          font-size: 12px;
          font-weight: 500;
          color: #04342c;
          margin-bottom: 5px;
        "
        >Package</label
      >
      <div
        style="
          height: 38px;
          border: 0.5px solid #c5e5d9;
          border-radius: var(--border-radius-md);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 11px;
          margin-bottom: 5px;
          background: #f2faf7;
        "
      >
        <span style="font-size: 13px; color: #04342c; font-weight: 500"
          >Kerala Backwaters Getaway</span
        ><i
          class="ti ti-pencil"
          aria-hidden="true"
          style="font-size: 14px; color: #0f6e56"
        ></i>
      </div>
      <p
        style="
          margin: 0 0 14px;
          font-size: 11px;
          color: var(--color-text-tertiary);
        "
      >
        Auto-filled — tap to change
      </p>

      <div style="display: flex; gap: 10px; margin-bottom: 14px">
        <div style="flex: 1">
          <label
            style="
              display: block;
              font-size: 12px;
              font-weight: 500;
              color: #04342c;
              margin-bottom: 5px;
            "
            >Travel dates</label
          >
          <div
            style="
              height: 38px;
              border: 0.5px solid #c5e5d9;
              border-radius: var(--border-radius-md);
              display: flex;
              align-items: center;
              padding: 0 11px;
            "
          >
            <span style="font-size: 12px; color: var(--color-text-tertiary)"
              >e.g. mid-July</span
            >
          </div>
        </div>
        <div style="width: 96px">
          <label
            style="
              display: block;
              font-size: 12px;
              font-weight: 500;
              color: #04342c;
              margin-bottom: 5px;
            "
            >People</label
          >
          <div
            style="
              height: 38px;
              border: 0.5px solid #c5e5d9;
              border-radius: var(--border-radius-md);
              display: flex;
              align-items: center;
              padding: 0 11px;
            "
          >
            <span style="font-size: 13px; color: var(--color-text-tertiary)"
              >2</span
            >
          </div>
        </div>
      </div>

      <label
        style="
          display: block;
          font-size: 12px;
          font-weight: 500;
          color: #04342c;
          margin-bottom: 5px;
        "
        >Message
        <span style="color: var(--color-text-tertiary); font-weight: 400"
          >(optional)</span
        ></label
      >
      <div
        style="
          min-height: 64px;
          border: 0.5px solid #c5e5d9;
          border-radius: var(--border-radius-md);
          padding: 9px 11px;
          margin-bottom: 18px;
        "
      >
        <span
          style="
            font-size: 12px;
            color: var(--color-text-tertiary);
            line-height: 1.5;
          "
          >Anything we should know? e.g. food preferences, budget, rooms,
          special requirements</span
        >
      </div>

      <div
        style="
          background: #1d9e75;
          border-radius: var(--border-radius-md);
          padding: 13px;
          text-align: center;
          margin-bottom: 11px;
        "
      >
        <span style="font-size: 15px; font-weight: 500; color: #ffffff"
          >Send enquiry</span
        >
      </div>
      <p style="margin: 0; text-align: center; font-size: 12px; color: #0f6e56">
        <i
          class="ti ti-phone"
          aria-hidden="true"
          style="font-size: 12px; vertical-align: -1px"
        ></i>
        Prefer to talk now? Call us
      </p>
    </div>
  </div>
</div>
